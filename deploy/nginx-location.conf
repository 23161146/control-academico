# Fragmento orientativo. Integra dentro del bloque server existente.
# Ajusta /var/www/html/t3_act8_eq05/ a la ruta real donde copies el contenido de dist.
location = /t3_act8_eq05 {
    return 301 /t3_act8_eq05/;
}

location /t3_act8_eq05/ {
    alias /var/www/html/t3_act8_eq05/;
    index index.html;
    try_files $uri $uri/ /t3_act8_eq05/index.html;
}
